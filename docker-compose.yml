version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: urbanrag-db
    environment:
      POSTGRES_DB: geovector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geovector"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: urbanrag-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: geovector
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata: